<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
  <title id="title">Process animation</title>
  <desc id="desc">Animated project process from diagnosis to launch.</desc>
  <style>
    .bg{fill:#151512}
    .text{fill:#fffaf1}
    .muted{fill:#fffaf1;opacity:.52}
    .green{fill:#00b66d}
    .line{fill:none;stroke:#fffaf1;stroke-opacity:.18;stroke-width:2}
    .scan{animation:scan 4.8s ease-in-out infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(430px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect class="bg" width="680" height="320" rx="28"/>
  <path class="line" d="M92 166h496"/>
  <rect class="green scan" x="76" y="132" width="86" height="68" rx="34"/>
  <g>
    <circle class="green pulse" cx="104" cy="166" r="14"/>
    <circle class="muted" cx="222" cy="166" r="10"/>
    <circle class="muted" cx="340" cy="166" r="10"/>
    <circle class="muted" cx="458" cy="166" r="10"/>
    <circle class="muted" cx="576" cy="166" r="10"/>
  </g>
  <rect class="muted" x="76" y="72" width="130" height="14" rx="7"/>
  <rect class="text" x="76" y="96" width="260" height="28" rx="14"/>
  <rect class="muted" x="430" y="226" width="174" height="14" rx="7"/>
  <rect class="text" x="430" y="250" width="112" height="22" rx="11"/>
</svg>
