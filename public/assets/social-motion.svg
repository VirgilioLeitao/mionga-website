<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Social media animation</title>
  <desc id="desc">Animated social content cards for Instagram management.</desc>
  <style>
    .card{fill:#fffaf1;stroke:#151512;stroke-opacity:.14}
    .dark{fill:#151512}
    .green{fill:#00b66d}
    .coral{fill:#ff8b66}
    .blue{fill:#8ec5ff}
    .muted{fill:#ded5c6}
    .a{animation:a 4.5s ease-in-out infinite}
    .b{animation:b 4.5s ease-in-out infinite}
    .c{animation:c 4.5s ease-in-out infinite}
    @keyframes a{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(8px,-12px) rotate(-2deg)}}
    @keyframes b{0%,100%{transform:translate(0,0) rotate(3deg)}50%{transform:translate(-8px,-10px) rotate(1deg)}}
    @keyframes c{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-14px)}}
  </style>
  <rect width="520" height="360" rx="28" fill="#f0ebe2"/>
  <g class="a">
    <rect class="card" x="78" y="76" width="156" height="208" rx="22"/>
    <rect class="green" x="100" y="102" width="112" height="92" rx="16"/>
    <rect class="dark" x="100" y="214" width="92" height="12" rx="6"/>
    <rect class="muted" x="100" y="238" width="112" height="10" rx="5"/>
  </g>
  <g class="b">
    <rect class="card" x="286" y="66" width="154" height="218" rx="22"/>
    <circle class="coral" cx="364" cy="144" r="48"/>
    <rect class="dark" x="314" y="220" width="100" height="12" rx="6"/>
    <rect class="muted" x="314" y="244" width="78" height="10" rx="5"/>
  </g>
  <g class="c">
    <rect class="dark" x="184" y="236" width="154" height="58" rx="29"/>
    <circle class="blue" cx="220" cy="265" r="16"/>
    <rect x="246" y="254" width="62" height="10" rx="5" fill="#fffaf1"/>
    <rect x="246" y="274" width="42" height="8" rx="4" fill="#fffaf1" opacity=".62"/>
  </g>
</svg>
